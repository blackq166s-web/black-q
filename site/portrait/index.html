<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.ico?v=20261127-transparent" type="image/x-icon" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-light.png?v=20261127-transparent" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon-dark.png?v=20261127-transparent" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
  <title>点阵人像背景</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #03090c; }
    #stage { position: relative; background: radial-gradient(ellipse at 42% 45%, #0c1c27, #020709 70%); }
    canvas, #fallback, .vignette { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    canvas { opacity: 0; }
    #fallback { z-index: 1; }
    #fallback img { position: absolute; left: 50%; height: 100%; width: auto; transform: translateX(-50%); }
    #portrait { z-index: 2; }
    .vignette { z-index: 3; background: radial-gradient(ellipse at 43% 46%, transparent 35%, #01060855 85%); }
    #stage[data-rendering="true"] canvas { opacity: 1; }
    #stage[data-rendering="true"] #fallback { opacity: 0; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="code" aria-hidden="true"></canvas>
    <picture id="fallback">
      <source media="(max-width: 699px)" srcset="assets/poster-narrow.webp">
      <img src="assets/poster-wide.webp" alt="点阵人像" fetchpriority="high" decoding="async">
    </picture>
    <canvas id="portrait" aria-hidden="true"></canvas>
    <div class="vignette"></div>
  </div>
  <script type="module" src="boot.js?v=20261119-portrait"></script>
</body>
</html>
